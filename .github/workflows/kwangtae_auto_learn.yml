name: KwangTae Autonomous Daily Learning

on:
  schedule:
    # 10:00 UTC = 17:00 Giờ Việt Nam (UTC+7), từ Thứ 2 đến Thứ 6 hàng tuần
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-learn-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện AI Machine Learning
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Chạy cỗ máy tự học KwangTae Cloud
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/kwangtae_daily_learn.py

      - name: Gửi báo cáo tổng kết 17h tới Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_daily_17h_report.py

      - name: Lưu trữ & Triển khai kết quả mới lên Cloud
        run: |
          git config --global user.name "KwangTae AI Agent"
          git config --global user.email "kwangtae-ai@users.noreply.github.com"
          git add public/kwangtae_radar.json
          git diff --staged --quiet || (git commit -m "🤖 [KwangTae Auto-Learn] Tự học & cập nhật Radar mới $(date +'%d/%m/%Y %H:%M')" && git push)
